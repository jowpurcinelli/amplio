# Reviewed scoped drop-in for the existing nightly backup, not another timer.
# Install only after identifying the exact healthy private ClickHouse container.
[Service]
EnvironmentFile=/etc/nellia/amplio-backup.env
ExecStartPre=/usr/local/bin/amplio-restic-hook before
ExecStopPost=/usr/local/bin/amplio-restic-hook cleanup
